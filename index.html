document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags  manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

y:inline-block;color:var(--accent);transform:translateY(110%);transition:transform 1.1s cubic-bezier(.16,1,.3,1);transition-delay:.38s\"\u003eEngineer\u003c/span\u003e\u003c/span\u003e\n      \u003c/h1\u003e\n\n      \u003cdiv style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:32px;margin-top:clamp(22px,4vh,44px)\"\u003e\n        \u003cp style=\"margin:0;max-width:540px;font-size:clamp(1rem,1.45vw,1.32rem);line-height:1.55;color:var(--fg)\"\u003e\n          Hey, I\u0027m \u003cstrong style=\"font-weight:700\"\u003eSaul Diaz\u003c/strong\u003e  I build complete web applications, from intuitive interfaces to reliable backend systems, with a focus on great user experiences.\n        \u003c/p\u003e\n        \u003cdiv style=\"display:flex;gap:12px;align-items:center\"\u003e\n          \u003csc-for list=\"{{ socials }}\" as=\"s\" hint-placeholder-count=\"3\"\u003e\n            \u003ca href=\"{{ s.href }}\" target=\"_blank\" rel=\"noopener\" data-mag=\"\" aria-label=\"{{ s.label }}\" style=\"cursor:none;font-family:\u0027JetBrains Mono\u0027,monospace;font-size:12px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;border:1.4px solid var(--line);border-radius:40px;padding:11px 18px;display:inline-flex;align-items:center;gap:8px;transition:background .3s,color .3s,border-color .3s\" data-fill=\"\"\u003e{{ s.label }} —\u003c/a\u003e\n          \u003c/sc-for\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003cdiv style=\"position:absolute;left:50%;bottom:24px;transform:translateX(-50%);font-family:\u0027JetBrains Mono\u0027,monospace;font-size:11px;letter-spacing:2px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px\"\u003e\n      SCROLL\n      \u003cspan style=\"display:block;width:1px;height:34px;background:linear-gradient(var(--muted),transparent)\"\u003e\u003c/span\u003e\n    \u003c/div\u003e\n  \u003c/header\u003e\n\n  \u003c!-- MARQUEE --\u003e\n  \u003csection style=\"border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--inv);color:var(--invfg);overflow:hidden;padding:18px 0\"\u003e\n    \u003cdiv style=\"display:flex;width:max-content;animation:marquee 32s linear infinite;will-change:transform\"\u003e\n      \u003csc-for list=\"{{ ticker }}\" as=\"t\" hint-placeholder-count=\"14\"\u003e\n        \u003cspan style=\"display:inline-flex;align-items:center;font-family:\u0027JetBrains Mono\u0027,monospace;font-weight:500;font-size:clamp(1rem,2vw,1.6rem);text-transform:uppercase;letter-spacing:1px;padding:0 26px\"\u003e{{ t }}\u003cspan style=\"color:var(--accent);margin-left:26px\"\u003e¦\u003c/span\u003e\u003c/span\u003e\n      \u003c/sc-for\u003e\n    \u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003c!-- ABOUT + STATS --\u003e\n  \u003csection id=\"about\" style=\"max-width:1500px;margin:0 auto;padding:clamp(70px,12vh,150px) clamp(20px,5vw,64px)\"\u003e\n    \u003cdiv style=\"display:grid;grid-template-columns:1fr;gap:clamp(40px,6vw,90px)\" data-grid=\"about\"\u003e\n      \u003cdiv data-reveal=\"\"\u003e\n        \u003cdiv style=\"font-family:\u0027JetBrains Mono\u0027,monospace;font-size:12.5px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:26px;display:flex;align-items:center;gap:10px\"\u003e(01)  About\u003c/div\u003e\n        \u003cp style=\"margin:0;font-size:clamp(1.5rem,3vw,2.7rem);line-height:1.32;font-weight:500;letter-spacing:-.02em\"\u003e\n          A Frontend Software Engineer with hands-on experience building modern web apps in \u003cspan style=\"color:var(--accent)\"\u003eReact\u003c/span\u003e, \u003cspan style=\"color:var(--accent)\"\u003eTypeScript\u003c/span\u003e \u0026amp; \u003cspan style=\"color:var(--accent)\"\u003eNode.js\u003c/span\u003e. I care about responsive interfaces, scalable backends and clean, \u003cem style=\"font-style:italic;font-family:\u0027Poppins\u0027\"\u003euser-focused\u003c/em\u003e solutions.\n        \u003c/p\u003e\n      \u003c/div\u003e\n\n      \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:14px\" data-reveal=\"\"\u003e\n        \u003csc-for list=\"{{ skills }}\" as=\"sk\" hint-placeholder-count=\"5\"\u003e\n          \u003cspan style=\"font-family:\u0027JetBrains Mono\u0027,monospace;font-size:13px;border:1.4px solid var(--line);border-radius:40px;padding:11px 18px;letter-spacing:.4px\"\u003e{{ sk }}\u003c/span\u003e\n        \u003c/sc-for\u003e\n      \u003c/div\u003e\n\n      \u003cdiv style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line)\" data-grid=\"stats\" data-reveal=\"\"\u003e\n        \u003csc-for list=\"{{ stats }}\" as=\"st\" hint-placeholder-count=\"4\"\u003e\n          \u003cdiv style=\"background:var(--bg);padding:clamp(22px,3vw,38px) clamp(16px,2vw,26px)\"\u003e\n            \u003cdiv data-count=\"{{ st.value }}\" style=\"font-size:clamp(2.4rem,5.5vw,4.6rem);font-weight:900;letter-spacing:-.04em;line-height:1;color:var(--accent)\"\u003e{{ st.value }}{{ st.suffix }}\u003c/div\u003e\n            \u003cdiv style=\"font-family:\u0027JetBrains Mono\u0027,monospace;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-top:12px\"\u003e{{ st.label }}\u003c/div\u003e\n          \u003c/div\u003e\n        \u003c/sc-for\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003c!-- WORK --\u003e\n  \u003csection id=\"work\" style=\"background:var(--inv);color:var(--invfg);padding:clamp(70px,12vh,150px) clamp(20px,5vw,64px)\"\u003e\n    \u003cdiv style=\"max-width:1500px;margin:0 auto\"\u003e\n      \u003cdiv style=\"display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:20px;margin-bottom:clamp(40px,7vh,80px)\" data-reveal=\"\"\u003e\n        \u003ch2 style=\"margin:0;font-size:clamp(2.4rem,8vw,7rem);font-weight:900;letter-spacing:-.04em;line-height:.85;text-transform:uppercase\"\u003eSelected\u003cbr\u003eWork\u003c/h2\u003e\n        \u003cdiv style=\"font-family:\u0027JetBrains Mono\u0027,monospace;font-size:12.5px;letter-spacing:2px;color:var(--accent);text-transform:uppercase\"\u003e(02)  Projects\u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003cdiv style=\"border-top:1px solid var(--line)\"\u003e\n        \u003csc-for list=\"{{ projects }}\" as=\"p\" hint-placeholder-count=\"6\"\u003e\n          \u003ca href=\"{{ p.href }}\" target=\"_blank\" rel=\"noopener\" data-project=\"\" style=\"cursor:none;display:grid;grid-template-columns:90px 1fr auto;align-items:center;gap:clamp(16px,3vw,48px);padding:clamp(26px,4vw,46px) 6px;border-bottom:1px solid var(--line);position:relative;overflow:hidden\"\u003e\n            \u003cspan style=\"font-family:\u0027JetBrains Mono\u0027,monospace;font-size:14px;color:var(--muted);z-index:2\"\u003e0{{ p.num }}\u003c/span\u003e\n            \u003cdiv style=\"z-index:2;display:flex;flex-direction:column;gap:8px\"\u003e\n              \u003cspan data-proj-title=\"\" style=\"font-size:clamp(1.7rem,4.5vw,3.6rem);font-weight:800;letter-spacing:-.03em;line-height:.95;transition:transform .5s cubic-bezier(.16,1,.3,1),color .4s;display:inline-block\"\u003e{{ p.name }}\u003c/span\u003e\n              \u003cspan style=\"color:var(--muted);font-size:clamp(.92rem,1.4vw,1.1rem);max-width:520px\"\u003e{{ p.desc }}\u003c/span\u003e\n            \u003c/div\u003e\n            \u003cdiv style=\"display:flex;align-items:center;gap:18px;z-index:2\"\u003e\n              \u003cdiv style=\"display:none;gap:8px\" data-proj-tags=\"\"\u003e\n                \u003csc-for list=\"{{ p.tags }}\" as=\"tg\" hint-placeholder-count=\"2\"\u003e\n                  \u003cspan style=\"font-family:\u0027JetBrains Mono\u0027,monospace;font-size:11px;border:1px solid var(--line);border-radius:30px;padding:6px 12px;color:var(--muted)\"\u003e{{ tg }}\u003c/span\u003e\n                \u003c/sc-for\u003e\n              \u003c/div\u003e\n              \u003cspan data-proj-arrow=\"\" style=\"font-size:clamp(1.6rem,3vw,2.4rem);transition:transform .5s cubic-bezier(.16,1,.3,1);display:inline-block\"\u003e\u003c/span\u003e\n            \u003c/div\u003e\n            \u003cspan data-proj-bg=\"\" style=\"position:absolute;inset:0;background:var(--accent);transform:translateY(101%);transition:transform .55s cubic-bezier(.16,1,.3,1);z-index:1\"\u003e\u003c/span\u003e\n          \u003c/a\u003e\n        \u003c/sc-for\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003c!-- EXPERIENCE --\u003e\n  \u003csection id=\"experience\" style=\"max-width:1500px;margin:0 auto;padding:clamp(70px,12vh,150px) clamp(20px,5vw,64px)\"\u003e\n    \u003cdiv style=\"font-family:\u0027JetBrains Mono\u0027,monospace;font-size:12.5px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:clamp(34px,5vh,60px)\" data-reveal=\"\"\u003e(03)  Experience\u003c/div\u003e\n    \u003csc-for list=\"{{ experience }}\" as=\"e\" hint-placeholder-count=\"2\"\u003e\n      \u003cdiv data-reveal=\"\" style=\"display:grid;grid-template-columns:1fr 2fr;gap:clamp(18px,4vw,60px);padding:clamp(28px,4vw,46px) 0;border-top:1px solid var(--line)\"\u003e\n        \u003cdiv\u003e\n          \u003cdiv style=\"font-size:clamp(1.4rem,2.6vw,2.1rem);font-weight:800;letter-spacing:-.02em\"\u003e{{ e.role }}\u003c/div\u003e\n          \u003cdiv style=\"color:var(--accent);font-weight:600;margin-top:4px;font-size:1.05rem\"\u003e{{ e.company }}\u003c/div\u003e\n          \u003cdiv style=\"font-family:\u0027JetBrains Mono\u0027,monospace;font-size:12px;color:var(--muted);margin-top:8px;letter-spacing:.5px\"\u003e{{ e.period }}\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp style=\"margin:0;font-size:clamp(1.02rem,1.5vw,1.28rem);line-height:1.6;color:var(--fg);align-self:center\"\u003e{{ e.desc }}\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/sc-for\u003e\n  \u003c/section\u003e\n\n  \u003c!-- CONTACT --\u003e\n  \u003csection id=\"contact\" style=\"background:var(--accent);color:#fff;padding:clamp(80px,16vh,200px) clamp(20px,5vw,64px);position:relative;overflow:hidden\"\u003e\n    \u003cdiv style=\"position:absolute;bottom:-40px;right:-20px;font-family:\u0027JetBrains Mono\u0027,monospace;font-size:clamp(40px,7vw,90px);font-weight:700;opacity:.12;white-space:nowrap\"\u003eslayfire11@ymail.com\u003c/div\u003e\n    \u003cdiv style=\"max-width:1500px;margin:0 auto;position:relative;z-index:2\"\u003e\n      \u003cdiv style=\"font-family:\u0027JetBrains Mono\u0027,monospace;font-size:12.5px;letter-spacing:2px;text-transform:uppercase;opacity:.8;margin-bottom:30px\" data-reveal=\"\"\u003e(04)  Contact\u003c/div\u003e\n      \u003ch2 data-reveal=\"\" style=\"margin:0;font-size:clamp(2.6rem,9vw,9rem);font-weight:900;letter-spacing:-.04em;line-height:.85;text-transform:uppercase\"\u003eLet\u0027s build\u003cbr\u003esomething.\u003c/h2\u003e\n      \u003ca href=\"mailto:slayfire11@ymail.com\" data-mag=\"\" data-contact-mail=\"\" style=\"cursor:none;display:inline-flex;align-items:center;gap:16px;margin-top:clamp(36px,6vh,64px);font-size:clamp(1.2rem,3vw,2.4rem);font-weight:600;border-bottom:2px solid rgba(255,255,255,.5);padding-bottom:8px\"\u003e\n        slayfire11@ymail.com \u003cspan style=\"font-size:.8em\"\u003e\u003c/span\u003e\n      \u003c/a\u003e\n      \u003cdiv style=\"display:flex;gap:14px;margin-top:clamp(40px,6vh,64px);flex-wrap:wrap\" data-reveal=\"\"\u003e\n        \u003csc-for list=\"{{ socials }}\" as=\"s\" hint-placeholder-count=\"3\"\u003e\n          \u003ca href=\"{{ s.href }}\" target=\"_blank\" rel=\"noopener\" data-mag=\"\" style=\"cursor:none;font-family:\u0027JetBrains Mono\u0027,monospace;font-size:13px;letter-spacing:.5px;text-transform:uppercase;border:1.4px solid rgba(255,255,255,.55);border-radius:40px;padding:13px 22px\"\u003e{{ s.label }} \u003c/a\u003e\n        \u003c/sc-for\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003c!-- FOOTER --\u003e\n  \u003cfooter style=\"background:var(--inv);color:var(--invfg);padding:40px clamp(20px,5vw,64px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px;font-family:\u0027JetBrains Mono\u0027,monospace;font-size:12.5px;letter-spacing:.5px\"\u003e\n    \u003cspan\u003e© 2026 Saul Diaz\u003c/span\u003e\n    \u003cspan style=\"opacity:.6\"\u003eFrontend Software Engineer Hammond, IN\u003c/span\u003e\n    \u003cspan ref=\"{{ clock }}\" style=\"color:var(--accent)\"\u003e--:--:--\u003c/span\u003e\n  \u003c/footer\u003e\n\n\u003c/div\u003e\n\u003c/x-dc\u003e\n\u003cscript type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\u0026quot;$preview\u0026quot;:{\u0026quot;width\u0026quot;:1440,\u0026quot;height\u0026quot;:900}}\"\u003e\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      nav: [\n        { label: \"About\", href: \"#about\" },\n        { label: \"Work\", href: \"#work\" },\n        { label: \"Experience\", href: \"#experience\" },\n        { label: \"Contact\", href: \"#contact\" },\n      ],\n      socials: [\n        { label: \"GitHub\", href: \"https://github.com/Slayfire23\" },\n        { label: \"LinkedIn\", href: \"https://www.linkedin.com/in/saul-diaz23\" },\n        { label: \"Resume\", href: \"https://docs.google.com/document/d/1NiHEZ8MXgdZpy_Qji_yVrX7mzqySQ21Rqqdv6Tbf_jY/edit?usp=sharing\" },\n      ],\n      ticker: (() =\u003e {\n        const s = [\"React\",\"TypeScript\",\"Next.js\",\"Node.js\",\"JavaScript\",\"Vue\",\"Vite\",\"PostgreSQL\",\"Firebase\",\"Tailwind\",\"Git\",\"Figma\",\"HTML5\",\"Clerk\"];\n        return s.concat(s);\n      })(),\n      skills: [\"Frontend Engineering\",\"Front-End Development\",\"Back-End Operations\",\"Analytical Skills\",\"Adaptability\"],\n      stats: [\n        { value: 14, suffix: \"\", label: \"Repositories\" },\n        { value: 97, suffix: \"\", label: \"Contributions / yr\" },\n        { value: 6, suffix: \"\", label: \"Shipped projects\" },\n        { value: 2026, suffix: \"\", label: \"Building since\" },\n      ],\n      projects: [\n        { num: 1, name: \"Skinstric\", desc: \"AI skincare-analysis interface  a polished, product-style React / Next.js experience.\", tags: [\"React\",\"Next.js\"], href: \"https://skinstric-ai-three.vercel.app\" },\n        { num: 2, name: \"Ultraverse\", desc: \"NFT marketplace-style platform, designed and shipped to production.\", tags: [\"React\",\"UI/UX\"], href: \"http://slayfire23.github.io/NFT-Marketplace\" },\n        { num: 3, name: \"Summarist\", desc: \"Book-summary marketing website with a clean, conversion-focused front end.\", tags: [\"Front-End\",\"Marketing\"], href: \"https://advanced-virtual-internship-aylanj53a-saul-diaz-s-projects.vercel.app\" },\n        { num: 4, name: \"SDM Steel\", desc: \"Multi-role internal app  auth, inventory and scheduling for a steel business.\", tags: [\"TypeScript\",\"Frontend\"], href: \"http://sdm-steel.vercel.app\" },\n        { num: 5, name: \"E-Commerce\", desc: \"Storefront concept exploring layout, product cards and cart flows.\", tags: [\"HTML\",\"CSS\"], href: \"https://slayfire23.github.io/E-Commerce/\" },\n        { num: 6, name: \"E-Portfolio\", desc: \"An earlier portfolio build the foundation this site grows from.\", tags: [\"HTML\",\"CSS\"], href: \"http://slayfire23.github.io/Portfolio\" },\n      ],\n      experience: [\n        { role: \"Web Developer\", company: \"Skinstric\", period: \"May 2026 · Hammond, IN\", desc: \"Built a responsive AI skincare-analysis interface using React / Next.js, recreating a polished product-style user experience end to end.\" },\n        { role: \"Web Developer\", company: \"Frontend Simplified\", period: \"Apr 2026 - May 2026\", desc: \"Designed and developed two production-hosted web applications: Ultraverse, an NFT marketplace-style platform, and Summarist, a book-summary marketing website.\" },\n      ],\n      cursorRing: this.cursorRing, cursorDot: this.cursorDot, progress: this.progress,\n      themeBtn: this.themeBtn, clock: this.clock,\n    };\n  }\n\n  componentDidMount() {\n    const root = document.documentElement;\n\n    // ---- custom cursor (lerp follow) ----\n    const ring = this.cursorRing, dot = this.cursorDot;\n    let mx = innerWidth/2, my = innerHeight/2, rx = mx, ry = my;\n    const isFine = matchMedia(\"(pointer:fine)\").matches;\n    if (isFine \u0026\u0026 ring \u0026\u0026 dot) {\n      addEventListener(\"mousemove\", e =\u003e { mx = e.clientX; my = e.clientY; dot.style.left = mx+\"px\"; dot.style.top = my+\"px\"; });\n      const loop = () =\u003e { rx += (mx-rx)*.18; ry += (my-ry)*.18; ring.style.left = rx+\"px\"; ring.style.top = ry+\"px\"; requestAnimationFrame(loop); };\n      loop();\n      const grow = () =\u003e { ring.style.width=\"70px\"; ring.style.height=\"70px\"; ring.style.background=\"var(--accent)\"; ring.style.borderColor=\"var(--accent)\"; dot.style.opacity=\"0\"; };\n      const shrink = () =\u003e { ring.style.width=\"42px\"; ring.style.height=\"42px\"; ring.style.background=\"transparent\"; ring.style.borderColor=\"var(--accent)\"; dot.style.opacity=\"1\"; };\n      document.querySelectorAll(\"a,button,[data-mag],[data-project]\").forEach(el =\u003e { el.addEventListener(\"mouseenter\",grow); el.addEventListener(\"mouseleave\",shrink); });\n    } else { if(ring)ring.style.display=\"none\"; if(dot)dot.style.display=\"none\"; const b=document.querySelector(\u0027[data-screen-label]\u0027); if(b)b.style.cursor=\"auto\"; }\n\n    // ---- magnetic ----\n    if (isFine) document.querySelectorAll(\"[data-mag]\").forEach(el =\u003e {\n      el.addEventListener(\"mousemove\", e =\u003e { const r=el.getBoundingClientRect(); const x=e.clientX-r.left-r.width/2, y=e.clientY-r.top-r.height/2; el.style.transform=`translate(${x*.3}px,${y*.4}px)`; el.style.transition=\"transform .1s linear\"; });\n      el.addEventListener(\"mouseleave\", () =\u003e { el.style.transform=\"translate(0,0)\"; el.style.transition=\"transform .5s cubic-bezier(.16,1,.3,1)\"; });\n    });\n\n    // ---- hero reveal (setTimeout fires even when iframe hidden; transition smooths in real browsers) ----\n    setTimeout(()=\u003e{ document.querySelectorAll(\"[data-hero]\").forEach(el=\u003e{ el.style.transform=\"translateY(0)\"; el.style.opacity=\"1\"; }); }, 70);\n\n    // ---- scroll reveal (apply final inline styles directly so it never sticks when throttled) ----\n    const io = new IntersectionObserver((es)=\u003e{ es.forEach(e=\u003e{ if(e.isIntersecting){ e.target.classList.add(\"in\"); e.target.style.opacity=\"1\"; e.target.style.transform=\"none\"; io.unobserve(e.target);} }); }, { threshold:.14 });\n    document.querySelectorAll(\"[data-reveal]\").forEach((el,i)=\u003e{ el.style.transitionDelay=(i%4*.08)+\"s\"; io.observe(el); });\n\n    // ---- count up ----\n    const cio = new IntersectionObserver((es)=\u003e{ es.forEach(e=\u003e{ if(!e.isIntersecting) return; cio.unobserve(e.target); const el=e.target; const end=+el.dataset.count; const dur=1400; const t0=performance.now(); const suf=el.textContent.replace(/[0-9]/g,\"\").trim(); const step=(t)=\u003e{ const p=Math.min(1,(t-t0)/dur); const v=Math.round((1-Math.pow(1-p,3))*end); el.textContent=v+suf; if(p\u003c1)requestAnimationFrame(step); }; requestAnimationFrame(step); }); }, { threshold:.5 });\n    document.querySelectorAll(\"[data-count]\").forEach(el=\u003ecio.observe(el));\n\n    // ---- responsive grids ----\n    const applyGrid = () =\u003e {\n      const w = innerWidth;\n      document.querySelectorAll(\u0027[data-grid=\"about\"]\u0027).forEach(g=\u003e{ g.style.gridTemplateColumns = w\u003e900 ? \"minmax(0,1.5fr) minmax(0,1fr)\" : \"1fr\"; });\n      document.querySelectorAll(\u0027[data-grid=\"stats\"]\u0027).forEach(g=\u003e{ g.style.gridTemplateColumns = w\u003e700 ? \"repeat(4,1fr)\" : \"repeat(2,1fr)\"; });\n      document.querySelectorAll(\"#experience [data-reveal]\").forEach(g=\u003e{ g.style.gridTemplateColumns = w\u003e760 ? \"1fr 2fr\" : \"1fr\"; });\n      document.querySelectorAll(\"[data-project]\").forEach(g=\u003e{ g.style.gridTemplateColumns = w\u003e700 ? \"70px 1fr auto\" : \"40px 1fr auto\"; });\n      document.querySelectorAll(\"[data-proj-tags]\").forEach(t=\u003e{ t.style.display = w\u003e900 ? \"flex\" : \"none\"; });\n    };\n    applyGrid(); addEventListener(\"resize\", applyGrid);\n\n    // ---- project row hover ----\n    document.querySelectorAll(\"[data-project]\").forEach(row =\u003e {\n      const title=row.querySelector(\"[data-proj-title]\"), arrow=row.querySelector(\"[data-proj-arrow]\"), bg=row.querySelector(\"[data-proj-bg]\");\n      row.addEventListener(\"mouseenter\", ()=\u003e{ if(bg)bg.style.transform=\"translateY(0)\"; if(title){title.style.transform=\"translateX(22px)\";title.style.color=\"#fff\";} if(arrow){arrow.style.transform=\"translate(10px,-10px)\";arrow.style.color=\"#fff\";} row.querySelectorAll(\"span,div\").forEach(s=\u003e{ if(s!==bg)s.style.color=\"#fff\"; }); });\n      row.addEventListener(\"mouseleave\", ()=\u003e{ if(bg)bg.style.transform=\"translateY(101%)\"; if(title){title.style.transform=\"translateX(0)\";title.style.color=\"\";} if(arrow){arrow.style.transform=\"translate(0,0)\";arrow.style.color=\"\";} row.querySelectorAll(\"span,div\").forEach(s=\u003e{ s.style.color=\"\"; }); });\n    });\n\n    // ---- pill fill hover (hero socials) ----\n    document.querySelectorAll(\"[data-fill]\").forEach(el =\u003e {\n      el.addEventListener(\"mouseenter\", ()=\u003e{ el.style.background=\"var(--accent)\"; el.style.color=\"#fff\"; el.style.borderColor=\"var(--accent)\"; });\n      el.addEventListener(\"mouseleave\", ()=\u003e{ el.style.background=\"transparent\"; el.style.color=\"\"; el.style.borderColor=\"var(--line)\"; });\n    });\n\n    // ---- nav underline ----\n    document.querySelectorAll(\"[data-navlink]\").forEach(a =\u003e {\n      a.addEventListener(\"mouseenter\", ()=\u003e{ a.style.opacity=\"1\"; });\n      a.addEventListener(\"mouseleave\", ()=\u003e{ a.style.opacity=\".85\"; });\n    });\n\n    // ---- scroll progress ----\n    const prog = this.progress;\n    const onScroll = () =\u003e { const h=document.documentElement; const p=h.scrollTop/(h.scrollHeight-h.clientHeight); if(prog)prog.style.width=(p*100)+\"%\"; };\n    addEventListener(\"scroll\", onScroll, {passive:true}); onScroll();\n\n    // ---- theme toggle (DOM only, no re-render) ----\n    const toggleTheme = () =\u003e {\n      const html = document.documentElement;\n      html.dataset.theme = html.dataset.theme === \"light\" ? \"dark\" : \"light\";\n    };\n    document.querySelectorAll(\"[data-theme-toggle]\").forEach(btn =\u003e {\n      btn.addEventListener(\"click\", e =\u003e { e.preventDefault(); toggleTheme(); });\n    });\n\n    // ---- live clock (Hammond / America/Chicago) ----\n    const clk = this.clock;\n    if (clk) { const tick = () =\u003e { try { clk.textContent = new Intl.DateTimeFormat(\"en-US\",{timeZone:\"America/Chicago\",hour:\"2-digit\",minute:\"2-digit\",second:\"2-digit\",hour12:false}).format(new Date()) + \" CST\"; } catch(e){ clk.textContent=new Date().toLocaleTimeString(); } }; tick(); setInterval(tick,1000); }\n  }\n}\n\u003c/script\u003e\n\n\n\u003c/body\u003e\u003c/html\u003e"
  </script>
